version: 2

before:
  hooks:
    - go mod tidy

builds:
  - id: sonora
    main: ./cmd/sonora
    binary: sonora
    ldflags:
      - -s -w -X sonora-cli/internal/version.Version={{.Version}}
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - id: sonora
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - "^test:"
      - "^ci:"
      - "^chore:"

release:
  github:
    owner: Sonora-Multiroom
    name: sonora-cli
